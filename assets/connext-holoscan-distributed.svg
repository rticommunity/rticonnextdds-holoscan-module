" text-anchor="middle">Distributed sensor samples · processed data · DDS topics over RTPS/UDP</text><rect x="60" y="844" width="1440" height="52" fill="#FFFFFF" rx="10" stroke="#DAE3ED" stroke-width="1.2" /><text x="80" y="876" fill="#19324D" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" text-anchor="start">Logical databus · peer-to-peer communication · no central broker</text><rect x="1100" y="865" width="35" height="7" fill="#84AA33" /><text x="1148" y="875" fill="#53677E" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="13" text-anchor="start">Sample flow</text><rect x="1340" y="866" width="26" height="4" fill="#EC8B22" /><text x="1380" y="875" fill="#53677E" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="13" text-anchor="start">Topic</text></svg>