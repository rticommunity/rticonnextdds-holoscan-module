<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="910" viewBox="0 0 1560 910" role="img" aria-label="Distributed sensors with layered Holoscan and RTI Connext DDS hosts"><title>Distributed Sensors: Holoscan and Connext</title><desc>Host A has a Holoscan layer above its Connext DDS layer. Host B has a Connext layer above its Holoscan consumer layer. Three physically separate sensor nodes each publish through a Connext DDS DataWriter. The hosts and sensor nodes share a logical DDS databus over the network, with no central broker.</desc><rect width="1560" height="910" fill="#FFFFFF" /><text x="60" y="48" fill="#19324D" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="34" text-anchor="start" font-weight="700">Distributed Sensors · Holoscan + Connext</text><text x="60" y="80" fill="#53677E" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="16" text-anchor="start">Layered compute hosts connected to independent, DDS-enabled sensor devices.</text><rect x="70" y="120" width="510" height="245" fill="#F5F8FC" rx="10" stroke="#172230" stroke-width="5" /><text x="100" y="151" fill="#19324D" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="start" font-weight="700">HOST A · Processing / publishing</text><rect x="100" y="173" width="450" height="70" fill="#FFFFFF" rx="8" stroke="#159947" stroke-width="6" /><text x="325.0" y="202" fill="#19324D" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="700">Holoscan</text><text x="325.0" y="226" fill="#53677E" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle">Sensor processing pipeline</text><line x1="325" y1="250" x2="325" y2="250" stroke="#84AA33" stroke-width="7" /><polygon points="325,266 314,250 336,250" fill="#84AA33" /><rect x="100" y="273" width="450" height="67" fill="#004C97" rx="9" /><text x="325.0" y="301" fill="#FFFFFF" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="23" text-anchor="middle" font-weight="700">RTI Connext DDS</text><text x="325.0" y="325" fill="#D8E8F7" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle">DataReader / DataWriter</text><rect x="70" y="556" width="510" height="245" fill="#F5F8FC" rx="10" stroke="#172230" stroke-width="5" /><text x="100" y="587" fill="#19324D" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="20" text-anchor="start" font-weight="700">HOST B</text><rect x="100" y="605" width="450" height="67" fill="#004C97" rx="9" /><text x="325.0" y="633" fill="#FFFFFF" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="23" text-anchor="middle" font-weight="700">RTI Connext DDS</text><text x="325.0" y="657" fill="#D8E8F7" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle">DataReader</text><line x1="325" y1="679" x2="325" y2="680" stroke="#84AA33" stroke-width="7" /><polygon points="325,696 314,680 336,680" fill="#84AA33" /><rect x="100" y="703" width="450" height="70" fill="#FFFFFF" rx="8" stroke="#159947" stroke-width="6" /><text x="325.0" y="732" fill="#19324D" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="24" text-anchor="middle" font-weight="700">Holoscan</text><text x="325.0" y="757" fill="#53677E" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="14" text-anchor="middle">Sensor fusion / visualization pipeline</text><text x="822.5" y="193" fill="#004C97" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="21" text-anchor="middle" font-weight="700">Distributed sensor nodes</text><text x="822.5" y="228" fill="#53677E" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="16" text-anchor="middle">Separate devices, shared DDS topics.</text><text x="822.5" y="256" fill="#53677E" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="15" text-anchor="middle">Samples reach any subscribed host.</text><rect x="1080" y="120" width="340" height="245" fill="#F5F8FC" rx="14" stroke="#DAE3ED" stroke-width="1.2" /><text x="1250.0" y="151" fill="#19324D" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" font-weight="700">REMOTE SENSOR NODE 1</text><polygon points="1250.0,171 1330,209.0 1250.0,247 1170,209.0" fill="#FFFFFF" stroke="#172230" stroke-width="4" stroke-linejoin="round" /><text x="1250.0" y="216" fill="#19324D" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="19" text-anchor="middle" font-weight="700">Sensor 1</text><line x1="1250" y1="254" x2="1250" y2="262" stroke="#84AA33" stroke-width="7" /><polygon points="1250,278 1239,262 1261,262" fill="#84AA33" /><rect x="1106" y="286" width="288" height="54" fill="#004C97" rx="8" /><text x="1250.0" y="308" fill="#FFFFFF" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle" font-weight="700">Connext DDS</text><text x="1250.0" y="329" fill="#D8E8F7" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle">DataWriter</text><rect x="700" y="556" width="340" height="245" fill="#F5F8FC" rx="14" stroke="#DAE3ED" stroke-width="1.2" /><rect x="726" y="579" width="288" height="55" fill="#004C97" rx="8" /><text x="870.0" y="602" fill="#FFFFFF" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle" font-weight="700">Connext DDS</text><text x="870.0" y="623" fill="#D8E8F7" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle">DataWriter</text><line x1="870" y1="678" x2="870" y2="658" stroke="#84AA33" stroke-width="7" /><polygon points="870,642 859,658 881,658" fill="#84AA33" /><polygon points="870.0,685 950,723.0 870.0,761 790,723.0" fill="#FFFFFF" stroke="#172230" stroke-width="4" stroke-linejoin="round" /><text x="870.0" y="730" fill="#19324D" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="19" text-anchor="middle" font-weight="700">Sensor 2</text><text x="870.0" y="788" fill="#19324D" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" font-weight="700">REMOTE SENSOR NODE 2</text><line x1="870" y1="494" x2="870" y2="579" stroke="#EC8B22" stroke-width="4" /><line x1="896" y1="571" x2="896" y2="520" stroke="#84AA33" stroke-width="10" /><polygon points="896,504 885,520 907,520" fill="#84AA33" /><text x="920" y="540" fill="#84AA33" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="12" text-anchor="start" font-weight="700">PUB</text><rect x="1080" y="556" width="340" height="245" fill="#F5F8FC" rx="14" stroke="#DAE3ED" stroke-width="1.2" /><rect x="1106" y="579" width="288" height="55" fill="#004C97" rx="8" /><text x="1250.0" y="602" fill="#FFFFFF" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="18" text-anchor="middle" font-weight="700">Connext DDS</text><text x="1250.0" y="623" fill="#D8E8F7" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="13" text-anchor="middle">DataWriter</text><line x1="1250" y1="678" x2="1250" y2="658" stroke="#84AA33" stroke-width="7" /><polygon points="1250,642 1239,658 1261,658" fill="#84AA33" /><polygon points="1250.0,685 1330,723.0 1250.0,761 1170,723.0" fill="#FFFFFF" stroke="#172230" stroke-width="4" stroke-linejoin="round" /><text x="1250.0" y="730" fill="#19324D" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="19" text-anchor="middle" font-weight="700">Sensor 3</text><text x="1250.0" y="788" fill="#19324D" font-family="Arial, Helvetica, DejaVu Sans, sans-serif" font-size="17" text-anchor="middle" font-weight="700">REMOTE SENSOR NODE 3</text><line x1="1250" y1="494" x2="1250" y2="579" stroke="#EC8B22" stroke-width="4" /><line x1="1276" y1="571" x2="1276" y2="520" stroke="#84AA33" stroke-width="10" /><polygon points="1276,504 1265,520 1287,520" fill="#84AA33" /><text x="1300" y="540" fill="#84AA33" font-fam